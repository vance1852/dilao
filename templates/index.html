<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线Markdown协同编辑器</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>📝 在线Markdown协同编辑器</h1>
            <div class="user-info">
                <span id="current-user"></span>
                <div class="online-users" id="online-users"></div>
            </div>
        </header>
        
        <div class="main-content">
            <div class="editor-container">
                <div class="editor-header">
                    <h3>编辑区</h3>
                    <span id="connection-status" class="status-connected">已连接</span>
                </div>
                <textarea id="editor" placeholder="在此输入Markdown内容..."></textarea>
                <div id="cursor-overlay"></div>
            </div>
            
            <div class="preview-container">
                <div class="editor-header">
                    <h3>预览区</h3>
                </div>
                <div id="preview" class="markdown-preview"></div>
            </div>
        </div>
        
        <footer class="footer">
            <button id="history-btn" class="btn">⏳ 历史回放</button>
            <div id="history-panel" class="history-panel hidden">
                <div class="history-header">
                    <h4>编辑历史回放</h4>
                    <button id="close-history" class="btn btn-small">× 关闭</button>
                </div>
                <div class="history-controls">
                    <input type="range" id="history-slider" min="0" max="0" value="0">
                    <div class="history-info">
                        <span>版本: <span id="version-number">0</span></span>
                        <button id="play-btn" class="btn btn-small">▶ 播放</button>
                        <button id="pause-btn" class="btn btn-small hidden">⏸ 暂停</button>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/static/js/ot.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
